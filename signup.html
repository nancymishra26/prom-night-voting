<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Prom Night 2026</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <h2>Prom Night 2026</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<section class="intro">
    <h2>Create Your Account</h2>
    <p>Join the Prom Night voting experience.</p>

    <div class="login-card">
        <form>
            <label>Full Name</label>
            <input type="text" placeholder="Enter your name" required>

            <label>Student ID</label>
            <input type="text" placeholder="Enter your student ID" required>

            <label>Student Email</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Create Password</label>
            <input type="password" placeholder="Create a password" required>

            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm your password" required>

            <a href="index.html" class="btn">Sign Up</a>
        </form>

        <p>Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>
</section>

<footer>Prom Night 2026 | Voting Project</footer>

</body>
</html>
